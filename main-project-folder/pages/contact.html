<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <title>Nala Soo Xiriir</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div id="header">
        <h1>Xiriirka Madaxtooyada</h1>
        <p>Halkaan noogu soo dir fariin ama talo aad hayso</p>
    </div>

    <div id="nav">
        <a href="../index.html">Hoyga</a>
        <a href="team.html">La-taliyayaasha</a>
        <a href="registration.html">Is-diiwaangelinta</a>
        <a href="contact.html" class="active">Xiriirka</a>
    </div>

    <div class="wrapper">
        <div class="main-form">
            <h2>La Xiriir Xafiiska</h2>
            <form action="#" method="POST">
                <div class="input-block">
                    <label>Magacaaga:</label>
                    <input type="text" name="cname" required placeholder="Magacaaga oo kooban...">
                </div>
                <div class="input-block">
                    <label>Mawduuca:</label>
                    <input type="text" name="subject" required placeholder="Maxay ku saabsan tahay fariintu?">
                </div>
                <div class="input-block">
                    <label>Fariintaada:</label>
                    <textarea name="msg" rows="5" placeholder="Ku qor fariintaada halkaan..."></textarea>
                </div>
                <input type="submit" value="Dir Fariinta" class="submit-btn">
            </form>
        </div>
    </div>

    <div id="footer">
        <p>&copy; Xuquuqda waxaa iska leh cadnaan cabdulaahi.</p>
    </div>

</body>
</html>
