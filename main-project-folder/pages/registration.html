<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <title>Is-diiwaangelinta Taageerayaasha</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div id="header">
        <h1>Ku Biir Shabakada</h1>
        <p>Buuxi foomka hoose si aad u noqoto taageere rasmi ah</p>
    </div>

    <div id="nav">
        <a href="../index.html">Hoyga</a>
        <a href="team.html">La-taliyayaasha</a>
        <a href="registration.html" class="active">Is-diiwaangelinta</a>
        <a href="contact.html">Xiriirka</a>
    </div>

    <div class="wrapper">
        <div class="main-form">
            <h2>Foomka Is-diiwaangelinta</h2>
            <form action="#" method="POST">
                <div class="input-block">
                    <label>Magacaaga oo Dhammaystiran:</label>
                    <input type="text" name="name" required placeholder="Qor magacaaga...">
                </div>
                <div class="input-block">
                    <label>Email-kaaga rasmiga ah:</label>
                    <input type="email" name="email" required placeholder="Tusaale@gmail.com">
                </div>
                <div class="input-block">
                    <label>Telefankaaga:</label>
                    <input type="tel" name="phone" placeholder="061xxxxxxx">
                </div>
                <div class="input-block">
                    <label>Nooca Lab/Dheddig:</label>
                    <input type="radio" name="jinsi" value="Lab"> Lab
                    <input type="radio" name="jinsi" value="Dheddig"> Dheddig
                </div>
                <div class="input-block">
                    <label>Dooro Gobolkaaga:</label>
                    <select name="gobol">
                        <option value="Banaadir">Banaadir</option>
                        <option value="Galmudug">Galmudug</option>
                        <option value="Hirshabelle">Hirshabelle</option>
                        <option value="Puntland">Puntland</option>
                    </select>
                </div>
                <div class="input-block">
                    <input type="checkbox" name="agree" required> Waxaan ogolaaday shuruudaha.
                </div>
                <input type="submit" value="Gudbi Xogta" class="submit-btn">
            </form>
        </div>
    </div>

    <div id="footer">
        <p>&copy;Xuquuqda waxaa iska leh cadnaan cabdulaahi.</p>
    </div>

</body>
</html>
